<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Chat Feedback Rating</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b5ff4d",
                        "background-light": "#fafafa",
                        "background-dark": "#18181b",
                        "card-light": "#ffffff",
                        "card-dark": "#27272a",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center p-0 m-0 overflow-x-hidden">
<!-- Mobile Container (Simulating iPhone Form Factor) -->
<div class="relative flex h-full min-h-screen w-full max-w-[430px] flex-col bg-background-light dark:bg-background-dark shadow-2xl overflow-hidden">
<!-- TopAppBar -->
<div class="flex items-center bg-transparent p-6 pb-2 justify-end">
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-card-light dark:bg-card-dark shadow-sm text-zinc-900 dark:text-zinc-100">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex-1 flex flex-col px-6">
<!-- Headline -->
<div class="pt-8 pb-10">
<h1 class="text-zinc-900 dark:text-zinc-100 text-[32px] font-bold leading-tight text-center tracking-tight">
                    Rate Your Experience
                </h1>
</div>
<!-- Star Rating (Modified for specific feedback use) -->
<div class="flex justify-center gap-2 pb-10">
<button class="text-primary">
<span class="material-symbols-outlined fill !text-5xl">star</span>
</button>
<button class="text-primary">
<span class="material-symbols-outlined fill !text-5xl">star</span>
</button>
<button class="text-primary">
<span class="material-symbols-outlined fill !text-5xl">star</span>
</button>
<button class="text-primary">
<span class="material-symbols-outlined fill !text-5xl">star</span>
</button>
<button class="text-zinc-200 dark:text-zinc-700">
<span class="material-symbols-outlined !text-5xl">star</span>
</button>
</div>
<!-- TextField Section -->
<div class="flex flex-col gap-4">
<label class="flex flex-col">
<textarea class="form-input flex w-full resize-none overflow-hidden rounded-xl text-zinc-900 dark:text-zinc-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border-none bg-card-light dark:bg-card-dark shadow-sm min-h-[160px] placeholder:text-zinc-400 p-5 text-base font-normal leading-relaxed" placeholder="Share your thoughts about our service (optional)"></textarea>
</label>
</div>
<!-- Chips Section -->
<div class="flex flex-wrap gap-3 py-6 justify-center">
<button class="flex h-11 items-center justify-center rounded-xl bg-primary text-zinc-900 px-6 font-semibold shadow-sm">
<p class="text-sm">Fast Response</p>
</button>
<button class="flex h-11 items-center justify-center rounded-xl bg-card-light dark:bg-card-dark text-zinc-600 dark:text-zinc-300 px-6 font-medium shadow-sm border border-zinc-100 dark:border-zinc-800">
<p class="text-sm">Very Helpful</p>
</button>
</div>
</div>
<!-- Sticky Footer Action -->
<div class="p-6 pb-10 bg-gradient-to-t from-background-light dark:from-background-dark via-background-light dark:via-background-dark to-transparent">
<button class="w-full bg-primary hover:bg-opacity-90 text-zinc-900 h-14 rounded-xl font-bold text-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center">
                Submit Feedback
            </button>
<!-- iOS Home Indicator simulation -->
<div class="mt-8 flex justify-center">
<div class="w-32 h-1.5 bg-zinc-300 dark:bg-zinc-700 rounded-full"></div>
</div>
</div>
</div>
<!-- Background Pattern Decorative Element -->
<div class="fixed -z-10 top-0 left-0 w-full h-full opacity-20 dark:opacity-5 pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-primary rounded-full blur-[100px]"></div>
</div>
</body></html>
