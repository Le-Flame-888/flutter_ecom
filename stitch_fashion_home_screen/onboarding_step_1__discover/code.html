<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding Step 1: Discover</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b0ff57",
                        "background-light": "#ffffff",
                        "background-dark": "#22262a",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<div class="flex items-center justify-end px-6 pt-12 pb-2">
<button class="text-sm font-bold uppercase tracking-widest text-[#717171] hover:text-primary transition-colors">

</div>

<div class="px-4 pt-4">
<div class="aspect-[4/5] w-full overflow-hidden rounded-xl bg-neutral-200 bg-cover bg-center shadow-lg" data-alt="Modern high-fashion models posing in vibrant trendy streetwear" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCRM7BUXFW7qJLMZqTma3mTdRabGeYIvhTQoRSxQBnoOqWPf-010zrhfOeFQrdlZAZ5M8qZ5LmFbrdle5R7pOEJjipB3rr8-RcxdXmtc2Q6GLoAXOxkFVhYN81_dRIaTjhsGjbvdSI8XnxNtgOzX1YRNebrthuuxFmC0R6MowWIjShAmsmlquX8OuR6JZNV8Lu7_eKyVO0bO4nKVAwi83JrkQaDSsOZiP7avpJXcKa5HonmE7nCzmTulrq3KNccxGQIHDPKqj5c8bTu');">
</div>
</div>

<div class="flex flex-1 flex-col justify-between px-8 pb-10 pt-8">
<div class="space-y-4">
<!-- Headline -->
<h1 class="text-center text-[34px] font-extrabold leading-[1.1] tracking-tight text-[#151d0c] dark:text-white">
                    Discover the <br/>
<span class="relative inline-block">
                        Latest Trends
                        <span class="absolute -bottom-1 left-0 h-2 w-full bg-primary/40 -z-10"></span>
</span>
</h1>
<!-- Body Text -->
<p class="text-center text-base font-medium leading-relaxed text-neutral-500 dark:text-neutral-400">
                    Explore a curated collection of modern fashion tailored specifically for your unique personal style.
                </p>
</div>
<!-- Interaction Area -->
<div class="flex flex-col items-center gap-8">
<!-- Page Indicators -->
<div class="flex items-center gap-2">
<div class="h-1.5 w-8 rounded-full bg-primary transition-all"></div>
<div class="h-1.5 w-1.5 rounded-full bg-neutral-200 dark:bg-neutral-700"></div>
<div class="h-1.5 w-1.5 rounded-full bg-neutral-200 dark:bg-neutral-700"></div>
</div>
<!-- Next Button -->
<button class="group relative flex w-full items-center justify-center gap-2 rounded-xl bg-primary px-8 py-5 text-lg font-extrabold text-[#151d0c] shadow-[0_10px_30px_-10px_rgba(176,255,87,0.5)] active:scale-[0.98] transition-transform">
