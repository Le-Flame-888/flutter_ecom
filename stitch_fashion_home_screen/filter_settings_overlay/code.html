<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Filter Settings Overlay</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#ea2a33",
                "background-light": "#f8f6f6",
                "background-dark": "#211111",
              },
              fontFamily: {
                "display": ["Public Sans"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#1b0e0e] antialiased">
<!-- Main Wrapper simulating a phone screen background -->
<div class="relative mx-auto max-w-[430px] h-screen bg-background-light dark:bg-background-dark overflow-hidden flex flex-col">
<!-- Bottom Sheet Simulation Container -->
<div class="relative flex-1 flex flex-col justify-end">
<!-- Bottom Sheet Content -->
<div class="bg-background-light dark:bg-background-dark rounded-t-3xl shadow-2xl flex flex-col max-h-[92%] animate-slide-up overflow-hidden">
<!-- BottomSheetHandle -->
<div class="flex flex-col items-center pt-3 pb-1">
<div class="h-1.5 w-12 rounded-full bg-gray-300 dark:bg-gray-700"></div>
</div>
<!-- TopAppBar -->
<div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-800">
<button class="text-sm font-semibold text-gray-500 hover:text-primary transition-colors uppercase tracking-wider">Reset</button>
<h2 class="text-gray-900 dark:text-white text-lg font-bold tracking-tight">Filters</h2>
<button class="text-sm font-bold text-primary uppercase tracking-wider">Done</button>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto no-scrollbar pb-32">
<!-- Section: Price Range -->
<div class="px-6 py-6">
<div class="flex items-center justify-between mb-8">
<h3 class="text-gray-900 dark:text-white text-xl font-extrabold tracking-tight">Price Range</h3>
<span class="text-primary font-bold text-sm bg-primary/10 px-3 py-1 rounded-full">$120 — $450</span>
</div>
<!-- Visual Histogram Simulation -->
<div class="flex items-end gap-1 px-2 h-12 mb-2 opacity-20">
<div class="flex-1 bg-gray-400 rounded-t-sm h-1/4"></div>
<div class="flex-1 bg-gray-400 rounded-t-sm h-2/4"></div>
<div class="flex-1 bg-gray-400 rounded-t-sm h-3/4"></div>
<div class="flex-1 bg-primary rounded-t-sm h-full"></div>
<div class="flex-1 bg-primary rounded-t-sm h-4/5"></div>
<div class="flex-1 bg-primary rounded-t-sm h-3/5"></div>
<div class="flex-1 bg-gray-400 rounded-t-sm h-2/5"></div>
<div class="flex-1 bg-gray-400 rounded-t-sm h-1/5"></div>
</div>
<!-- Slider Component -->
<div class="relative w-full h-10 flex items-center">
<div class="absolute h-1 w-full bg-gray-200 dark:bg-gray-800 rounded-full"></div>
<div class="absolute h-1 bg-primary left-[20%] right-[30%] rounded-full"></div>
<!-- Left Handle -->
<div class="absolute left-[20%] -ml-3 flex flex-col items-center">
<div class="size-6 rounded-full bg-white border-2 border-primary shadow-lg ring-4 ring-primary/10"></div>
</div>
<!-- Right Handle -->
<div class="absolute right-[30%] -mr-3 flex flex-col items-center">
<div class="size-6 rounded-full bg-white border-2 border-primary shadow-lg ring-4 ring-primary/10"></div>
</div>
</div>
</div>
<!-- Section: Colors -->
<div class="px-6 py-6 border-t border-gray-100 dark:border-gray-800">
<h3 class="text-gray-900 dark:text-white text-xl font-extrabold tracking-tight mb-6">Colors</h3>
<div class="flex flex-wrap gap-4">
<!-- Black -->
<div class="relative flex flex-col items-center gap-2">
<button class="size-12 rounded-full bg-black ring-offset-4 ring-2 ring-transparent transition-all hover:ring-gray-200"></button>
<span class="text-[10px] font-bold uppercase tracking-tighter text-gray-500">Black</span>
</div>
<!-- White -->
<div class="relative flex flex-col items-center gap-2">
<button class="size-12 rounded-full bg-white border border-gray-200 ring-offset-4 ring-2 ring-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-xl font-bold">check</span>
</button>
<span class="text-[10px] font-bold uppercase tracking-tighter text-primary">White</span>
</div>
<!-- Primary Red -->
<div class="relative flex flex-col items-center gap-2">
<button class="size-12 rounded-full bg-primary ring-offset-4 ring-2 ring-transparent transition-all"></button>
<span class="text-[10px] font-bold uppercase tracking-tighter text-gray-500">Red</span>
</div>
<!-- Tan/Beige -->
<div class="relative flex flex-col items-center gap-2">
<button class="size-12 rounded-full bg-[#D2B48C] ring-offset-4 ring-2 ring-transparent transition-all"></button>
<span class="text-[10px] font-bold uppercase tracking-tighter text-gray-500">Tan</span>
</div>
<!-- Forest Green -->
<div class="relative flex flex-col items-center gap-2">
<button class="size-12 rounded-full bg-[#228B22] ring-offset-4 ring-2 ring-transparent transition-all"></button>
<span class="text-[10px] font-bold uppercase tracking-tighter text-gray-500">Green</span>
</div>
</div>
</div>
<!-- Section: Size -->
<div class="px-6 py-6 border-t border-gray-100 dark:border-gray-800">
<h3 class="text-gray-900 dark:text-white text-xl font-extrabold tracking-tight mb-6">Size</h3>
<div class="grid grid-cols-4 gap-3">
<button class="py-4 rounded-xl border-2 border-gray-100 dark:border-gray-800 text-sm font-bold text-gray-900 dark:text-white hover:border-primary transition-colors">XS</button>
<button class="py-4 rounded-xl border-2 border-primary bg-primary text-sm font-bold text-white shadow-lg shadow-primary/30">S</button>
<button class="py-4 rounded-xl border-2 border-gray-100 dark:border-gray-800 text-sm font-bold text-gray-900 dark:text-white hover:border-primary transition-colors">M</button>
<button class="py-4 rounded-xl border-2 border-gray-100 dark:border-gray-800 text-sm font-bold text-gray-900 dark:text-white hover:border-primary transition-colors">L</button>
<button class="py-4 rounded-xl border-2 border-gray-100 dark:border-gray-800 text-sm font-bold text-gray-900 dark:text-white hover:border-primary transition-colors">XL</button>
<button class="py-4 rounded-xl border-2 border-gray-100 dark:border-gray-800 text-sm font-bold text-gray-900 dark:text-white hover:border-primary transition-colors">XXL</button>
</div>
</div>
<!-- Section: Brands -->
<div class="px-6 py-6 border-t border-gray-100 dark:border-gray-800">
<div class="flex items-center justify-between mb-6">
<h3 class="text-gray-900 dark:text-white text-xl font-extrabold tracking-tight">Brands</h3>
<button class="text-primary text-xs font-bold uppercase tracking-widest">See All</button>
</div>
<div class="flex flex-wrap gap-2">
<div class="flex items-center gap-2 px-4 py-2 bg-gray-100 dark:bg-gray-800 rounded-full border border-transparent hover:border-primary/50 transition-all cursor-pointer">
<span class="text-sm font-semibold text-gray-800 dark:text-gray-200">Nike</span>
</div>
<div class="flex items-center gap-2 px-4 py-2 bg-primary/10 border border-primary rounded-full cursor-pointer">
<span class="text-sm font-bold text-primary">Zara</span>
<span class="material-symbols-outlined text-sm">close</span>
</div>
<div class="flex items-center gap-2 px-4 py-2 bg-gray-100 dark:bg-gray-800 rounded-full border border-transparent hover:border-primary/50 transition-all cursor-pointer">
<span class="text-sm font-semibold text-gray-800 dark:text-gray-200">Adidas</span>
</div>
<div class="flex items-center gap-2 px-4 py-2 bg-gray-100 dark:bg-gray-800 rounded-full border border-transparent hover:border-primary/50 transition-all cursor-pointer">
<span class="text-sm font-semibold text-gray-800 dark:text-gray-200">Balenciaga</span>
</div>
<div class="flex items-center gap-2 px-4 py-2 bg-gray-100 dark:bg-gray-800 rounded-full border border-transparent hover:border-primary/50 transition-all cursor-pointer">
<span class="text-sm font-semibold text-gray-800 dark:text-gray-200">Gucci</span>
</div>
</div>
</div>
</div>
<!-- Sticky Bottom Action Button -->
<div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-light via-background-light/95 to-transparent dark:from-background-dark dark:via-background-dark/95">
<button class="w-full bg-primary hover:bg-primary/90 text-white py-5 rounded-2xl text-base font-black uppercase tracking-widest shadow-xl shadow-primary/40 flex items-center justify-center gap-3 transition-transform active:scale-[0.98]">
                        Apply Filters
                        <span class="bg-white/20 px-3 py-1 rounded-lg text-sm">24 Items</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
