<!DOCTYPE html>

<html class="light" lang="en"><head>

<title>Onboarding Step 2: Shop</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script id="tailwind-config">

            darkMode: "class",

                extend: {
                    colors: {
                        "primary": "#b0ff57",
                        "background-light": "#ffffff",
                        "background-dark": "#121417",
                        "soft-grey": "#8B8B8B",
                        "accent-dark": "#1a1d21",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",

                        "xl": "1.5rem",

                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hero-mask {
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
    </style>
<style>

</div>
<!-- Floating UI element simulation -->
<div class="absolute bottom-8 right-8 bg-white dark:bg-accent-dark p-3 rounded-lg shadow-xl flex items-center gap-3 border border-gray-100 dark:border-zinc-700">
<div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-black font-bold">check</span>
</div>
<div>
<p class="text-[10px] font-bold text-soft-grey uppercase tracking-wider">Order Status</p>
<p class="text-xs font-bold dark:text-white">Payment Successful</p>
</div>
</div>
</div>
</div>

<div class="px-8 pt-8 pb-4 flex flex-col items-center">
<h1 class="text-[#151d0c] dark:text-white tracking-tight text-3xl font-extrabold leading-tight text-center mb-4">

<p class="text-soft-grey text-base font-normal leading-relaxed text-center max-w-[300px]">
                Add items to your cart and checkout in just a few taps with our secure system.
            </p>
</div>

<div class="flex w-full flex-row items-center justify-center gap-2 py-6">
<div class="h-1.5 w-1.5 rounded-full bg-zinc-200 dark:bg-zinc-700"></div>

<div class="h-1.5 w-1.5 rounded-full bg-zinc-200 dark:bg-zinc-700"></div>
</div>
