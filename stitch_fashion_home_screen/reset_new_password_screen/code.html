<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset New Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b5ff4d",
                        "background-light": "#f7f8f5",
                        "background-dark": "#1b230f",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Public Sans", sans-serif;
        }
        .ios-shadow {
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.04);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#161d0c] dark:text-[#f7f8f5] transition-colors duration-300">
<div class="relative mx-auto flex h-full min-h-screen max-w-[430px] flex-col overflow-x-hidden border-x border-gray-100 dark:border-gray-800 shadow-2xl bg-background-light dark:bg-background-dark">
<!-- TopAppBar -->
<div class="flex items-center p-4 pb-2 justify-between">
<button class="flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex-1"></div>
</div>
<!-- Progress Indicator (Subtle UI Choice) -->
<div class="px-4 mt-2">
<div class="h-1 w-full bg-gray-200 dark:bg-gray-800 rounded-full overflow-hidden">
<div class="h-full bg-primary w-2/3 rounded-full"></div>
</div>
</div>
<main class="flex-1 px-4 flex flex-col">
<!-- HeadlineText -->
<div class="pt-8 pb-2">
<h1 class="text-[#161d0c] dark:text-white tracking-tight text-[32px] font-bold leading-tight text-left">
                    Create New Password
                </h1>
</div>
<!-- BodyText -->
<div class="pb-8">
<p class="text-[#4e5e3a] dark:text-[#a1b08c] text-base font-normal leading-relaxed">
                    Your new password must be different from previous passwords for better security.
                </p>
</div>
<!-- Password Inputs -->
<div class="space-y-6">
<!-- TextField: New Password -->
<div class="flex flex-col gap-2">
<label class="flex flex-col flex-1">
<p class="text-[#161d0c] dark:text-[#f7f8f5] text-sm font-semibold leading-normal pb-2 ml-1">New Password</p>
<div class="flex w-full items-stretch rounded-xl ios-shadow">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-xl text-[#161d0c] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#deeacd] dark:border-gray-700 bg-white dark:bg-[#252d1a] h-14 placeholder:text-[#7aa145]/50 p-[15px] border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Min. 8 characters" type="password" value="password123"/>
<div class="flex border border-[#deeacd] dark:border-gray-700 bg-white dark:bg-[#252d1a] items-center justify-center pr-[15px] rounded-r-xl border-l-0 text-[#7aa145]">
<span class="material-symbols-outlined cursor-pointer select-none">visibility</span>
</div>
</div>
</label>
</div>
<!-- TextField: Confirm Password -->
<div class="flex flex-col gap-2">
<label class="flex flex-col flex-1">
<p class="text-[#161d0c] dark:text-[#f7f8f5] text-sm font-semibold leading-normal pb-2 ml-1">Confirm Password</p>
<div class="flex w-full items-stretch rounded-xl ios-shadow">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-xl text-[#161d0c] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#deeacd] dark:border-gray-700 bg-white dark:bg-[#252d1a] h-14 placeholder:text-[#7aa145]/50 p-[15px] border-r-0 pr-2 text-base font-normal leading-normal" placeholder="••••••••" type="password" value=""/>
<div class="flex border border-[#deeacd] dark:border-gray-700 bg-white dark:bg-[#252d1a] items-center justify-center pr-[15px] rounded-r-xl border-l-0 text-[#7aa145]">
<span class="material-symbols-outlined cursor-pointer select-none">visibility_off</span>
</div>
</div>
</label>
</div>
</div>
<!-- Password Requirements (Context-specific addition) -->
<div class="mt-6 flex flex-wrap gap-2 px-1">
<span class="inline-flex items-center px-3 py-1 rounded-full bg-primary/20 text-[#4e5e3a] text-xs font-medium border border-primary/30">
<span class="material-symbols-outlined text-xs mr-1">check</span> 8+ Characters
                </span>
<span class="inline-flex items-center px-3 py-1 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 text-xs font-medium border border-gray-200 dark:border-gray-700">
                    One number
                </span>
<span class="inline-flex items-center px-3 py-1 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 text-xs font-medium border border-gray-200 dark:border-gray-700">
                    Special symbol
                </span>
</div>
<div class="flex-1"></div>
<!-- Full-width Lime Green Reset Button -->
<div class="pb-10 pt-6">
<button class="w-full bg-primary hover:bg-[#a2e645] active:scale-[0.98] transition-all text-[#1b230f] font-bold text-lg py-5 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                    Reset Password
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- Success Interaction Overlay (Preview State) -->
<!-- In a real app, this would be triggered by state -->
<div class="hidden absolute inset-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm flex flex-col items-center justify-center p-8 text-center">
<div class="size-24 bg-primary rounded-full flex items-center justify-center mb-6 shadow-xl shadow-primary/40">
<span class="material-symbols-outlined text-5xl text-background-dark font-bold">check</span>
</div>
<h2 class="text-2xl font-bold mb-2">Password Updated</h2>
<p class="text-gray-500 dark:text-gray-400 mb-8">Your security is our priority. Log in with your new password to continue shopping.</p>
<button class="w-full bg-[#1b230f] dark:bg-primary dark:text-[#1b230f] text-white font-bold py-4 rounded-xl">
                Log In Now
            </button>
</div>
</div>
</body></html>
