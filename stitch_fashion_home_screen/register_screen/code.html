<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b0ff57",
                        "background-light": "#ffffff",
                        "background-dark": "#101214",
                        "charcoal": "#151d0c",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .form-input:focus {
            border-color: #b0ff57 !important;
            box-shadow: 0 0 0 1px #b0ff57;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-charcoal dark:text-white min-h-screen">
<div class="max-w-[480px] mx-auto min-h-screen flex flex-col px-6 pt-4 pb-10">
<!-- Top App Bar (iOS Style) -->
<div class="flex items-center justify-between mb-8">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<div class="h-1.5 w-16 bg-charcoal/5 dark:bg-white/10 rounded-full overflow-hidden">
<div class="h-full bg-primary w-2/3"></div>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
<!-- Headline -->
<div class="mb-10">
<h1 class="text-[36px] font-extrabold leading-tight tracking-tight mb-2">Create Account</h1>
<p class="text-charcoal/60 dark:text-white/60 text-base font-medium">Join the fashion community today.</p>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-5">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="text-sm font-bold uppercase tracking-wider text-charcoal/40 dark:text-white/40 ml-1">Full Name</label>
<input class="form-input w-full h-16 px-5 rounded-xl border-none bg-charcoal/[0.03] dark:bg-white/[0.05] text-charcoal dark:text-white placeholder:text-charcoal/30 dark:placeholder:text-white/30 text-lg font-medium transition-all" placeholder="e.g., Jane Doe" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-2">
<label class="text-sm font-bold uppercase tracking-wider text-charcoal/40 dark:text-white/40 ml-1">Email</label>
<input class="form-input w-full h-16 px-5 rounded-xl border-none bg-charcoal/[0.03] dark:bg-white/[0.05] text-charcoal dark:text-white placeholder:text-charcoal/30 dark:placeholder:text-white/30 text-lg font-medium transition-all" placeholder="hello@example.com" type="email"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<label class="text-sm font-bold uppercase tracking-wider text-charcoal/40 dark:text-white/40 ml-1">Password</label>
<div class="relative">
<input class="form-input w-full h-16 px-5 rounded-xl border-none bg-charcoal/[0.03] dark:bg-white/[0.05] text-charcoal dark:text-white placeholder:text-charcoal/30 dark:placeholder:text-white/30 text-lg font-medium transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-charcoal/40 dark:text-white/40">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-2">
<label class="text-sm font-bold uppercase tracking-wider text-charcoal/40 dark:text-white/40 ml-1">Confirm Password</label>
<div class="relative">
<input class="form-input w-full h-16 px-5 rounded-xl border-none bg-charcoal/[0.03] dark:bg-white/[0.05] text-charcoal dark:text-white placeholder:text-charcoal/30 dark:placeholder:text-white/30 text-lg font-medium transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-charcoal/40 dark:text-white/40">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
</div>
<!-- Terms & Conditions -->
<div class="mt-6 flex items-start gap-3 px-1">
<div class="relative flex items-center h-5">
<input class="w-5 h-5 rounded border-charcoal/10 text-primary focus:ring-primary/20 bg-charcoal/[0.03] dark:bg-white/10 dark:border-white/10" id="terms" type="checkbox"/>
</div>
<label class="text-sm text-charcoal/70 dark:text-white/70 leading-relaxed" for="terms">
                I agree to the <span class="text-charcoal dark:text-white font-bold underline decoration-primary decoration-2 underline-offset-2">Terms &amp; Conditions</span> and Privacy Policy.
            </label>
</div>
<!-- Sign Up Button -->
<button class="mt-8 w-full h-16 bg-primary rounded-xl text-charcoal font-extrabold text-lg flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all">
            Sign Up
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Social Signup -->
<div class="mt-10 mb-8">
<div class="relative flex py-5 items-center">
<div class="flex-grow border-t border-charcoal/5 dark:border-white/5"></div>
<span class="flex-shrink mx-4 text-xs font-bold uppercase tracking-[0.2em] text-charcoal/30 dark:text-white/30">Or join with</span>
<div class="flex-grow border-t border-charcoal/5 dark:border-white/5"></div>
</div>
<div class="flex gap-4">
<button class="flex-1 h-14 rounded-xl border border-charcoal/5 dark:border-white/10 flex items-center justify-center hover:bg-charcoal/[0.02] dark:hover:bg-white/[0.02] transition-colors">
<img alt="Google" class="w-5 h-5" data-alt="Google logo colorful icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJIKh1EreJQTF8AlqT4ur-lNvmez-zf1K60TduIiICdfsFxdzfcoC94nnNY-76IVsQdokDquAXcPhWBzzKl-gRAJ9q4sSOBPjb6kxHQ22aMHScNZERJ5WA2kKYE1QxQUhtpxJkhaNuBOLcOmhtj8KPnPcxUL8KGJpcMkeAP7-uuQq1G8GIfrU8CROccdkmzh1rpOVf5vXGfc6D81Pa6iew4SssKNftJHmo_0D568OUsEn7WJM9CD2TFTUrdQSGJO_XcyV_agoOTgyH"/>
</button>
<button class="flex-1 h-14 rounded-xl border border-charcoal/5 dark:border-white/10 flex items-center justify-center hover:bg-charcoal/[0.02] dark:hover:bg-white/[0.02] transition-colors">
<span class="material-symbols-outlined text-[24px]">ios</span>
</button>
</div>
</div>
<!-- Footer Link -->
<div class="mt-auto pt-4 text-center">
<p class="text-[15px] font-medium text-charcoal/60 dark:text-white/60">
                Already have an account? 
                <a class="text-charcoal dark:text-white font-bold ml-1 relative group" href="#">
                    Login
                    <span class="absolute -bottom-1 left-0 w-full h-1 bg-primary scale-x-100 group-hover:scale-x-110 transition-transform"></span>
</a>
</p>
</div>
</div>
</body></html>
