<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Style Quiz - Color Palette</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b5ff4d",
                        "background-light": "#fffcfa",
                        "background-dark": "#17191c",
                    },
                    fontFamily: {
                        "display": ["Epilogue", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Epilogue', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .swatch-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }
        .custom-radio:checked + div {
            box-shadow: 0 0 0 3px #b5ff4d;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#161d0c] dark:text-white transition-colors duration-300">
<div class="relative flex h-screen max-w-md mx-auto flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="flex items-center px-6 py-4 justify-between bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md sticky top-0 z-10">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</button>
<h2 class="text-sm font-bold uppercase tracking-widest">Style Quiz</h2>
<div class="size-10"></div> <!-- Spacer for symmetry -->
</header>
<!-- Progress Section -->
<div class="px-6 py-2">
<div class="flex justify-between items-end mb-2">
<span class="text-[10px] font-extrabold uppercase tracking-tighter opacity-50">Step 2 of 5</span>
<span class="text-[10px] font-extrabold uppercase tracking-tighter">40% Complete</span>
</div>
<div class="h-1.5 w-full bg-black/5 dark:bg-white/10 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 40%;"></div>
</div>
</div>
<main class="flex-1 overflow-y-auto px-6 py-8">
<!-- Headline & Subtext -->
<div class="mb-10 text-center">
<h1 class="text-4xl font-extrabold leading-[1.1] tracking-tight mb-4">
                    Which colors do you wear most?
                </h1>
<p class="text-sm font-medium opacity-60 max-w-[280px] mx-auto leading-relaxed">
                    This helps us curate your daily recommendations.
                </p>
</div>
<!-- Custom Radio/Checkbox Swatch List -->
<div class="swatch-grid mb-12">
<!-- Neutral Swatch (Selected Example) -->
<label class="relative group cursor-pointer">
<input checked="" class="peer absolute opacity-0" type="checkbox"/>
<div class="aspect-square rounded-full flex flex-col items-center justify-center p-4 transition-all duration-300 ring-offset-4 ring-offset-background-light dark:ring-offset-background-dark peer-checked:ring-4 peer-checked:ring-primary bg-[#E5DACE]">
<div class="size-14 rounded-full shadow-inner bg-gradient-to-br from-[#D2B48C] to-[#BC8F8F]"></div>
<span class="mt-3 text-xs font-bold uppercase tracking-wider text-stone-800">Neutral</span>
</div>
</label>
<!-- Vibrant Swatch -->
<label class="relative group cursor-pointer">
<input class="peer absolute opacity-0" type="checkbox"/>
<div class="aspect-square rounded-full flex flex-col items-center justify-center p-4 transition-all duration-300 ring-offset-4 ring-offset-background-light dark:ring-offset-background-dark peer-checked:ring-4 peer-checked:ring-primary bg-[#FFEDF1]">
<div class="size-14 rounded-full shadow-inner bg-gradient-to-tr from-[#FF4500] via-[#FFD700] to-[#FF1493]"></div>
<span class="mt-3 text-xs font-bold uppercase tracking-wider text-rose-800">Vibrant</span>
</div>
</label>
<!-- Pastels Swatch -->
<label class="relative group cursor-pointer">
<input class="peer absolute opacity-0" type="checkbox"/>
<div class="aspect-square rounded-full flex flex-col items-center justify-center p-4 transition-all duration-300 ring-offset-4 ring-offset-background-light dark:ring-offset-background-dark peer-checked:ring-4 peer-checked:ring-primary bg-[#F3E8FF]">
<div class="size-14 rounded-full shadow-inner bg-gradient-to-bl from-[#E0BBE4] via-[#957DAD] to-[#D291BC]"></div>
<span class="mt-3 text-xs font-bold uppercase tracking-wider text-purple-800">Pastels</span>
</div>
</label>
<!-- Monochrome Swatch -->
<label class="relative group cursor-pointer">
<input class="peer absolute opacity-0" type="checkbox"/>
<div class="aspect-square rounded-full flex flex-col items-center justify-center p-4 transition-all duration-300 ring-offset-4 ring-offset-background-light dark:ring-offset-background-dark peer-checked:ring-4 peer-checked:ring-primary bg-[#F1F1F1]">
<div class="size-14 rounded-full shadow-inner bg-gradient-to-r from-black via-zinc-500 to-white border border-black/10"></div>
<span class="mt-3 text-xs font-bold uppercase tracking-wider text-zinc-900">Monochrome</span>
</div>
</label>
</div>
</main>
<!-- Bottom Actions -->
<footer class="p-6 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent pt-10">
<div class="flex flex-col gap-3">
<button class="w-full bg-primary py-5 rounded-xl text-black font-extrabold text-base tracking-tight shadow-xl shadow-primary/20 active:scale-[0.98] transition-transform">
                    NEXT STEP
                </button>
<button class="w-full py-4 text-sm font-bold opacity-40 hover:opacity-100 transition-opacity">
                    BACK
                </button>
</div>
</footer>
<!-- iPhone Notch Placeholder for realism -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-black rounded-b-2xl z-20"></div>
</div>
</body></html>
