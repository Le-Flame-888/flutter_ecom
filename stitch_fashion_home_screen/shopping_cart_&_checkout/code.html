<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Shopping Cart &amp; Checkout</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b0ff57",
                        "background-light": "#f7f8f5",
                        "background-dark": "#1a230f",
                    },
                    fontFamily: {
                        "display": ["Epilogue"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#151d0c] dark:text-white antialiased">
<div class="relative flex h-screen w-full flex-col max-w-[480px] mx-auto bg-background-light dark:bg-background-dark overflow-hidden">
<!-- TopAppBar -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between z-10 sticky top-0">
<button class="text-[#151d0c] dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h2 class="text-[#151d0c] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Your Cart (3)</h2>
<div class="flex w-12 items-center justify-end">
<button class="flex size-12 cursor-pointer items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-2xl">shopping_bag</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-4 pb-40">
<div class="space-y-4 pt-4">
<!-- ListItem 1 -->
<div class="flex items-center gap-4 bg-white dark:bg-black/20 p-4 rounded-xl shadow-sm border border-black/5 dark:border-white/5">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-20 shrink-0" data-alt="Oversized linen shirt in cream color hanging on a rack" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD3mPEgmNfFoQy_vaiHKzDKSABGhrxZB3M1QxjXLuxrOv-rSr17YccNSjnNp2rqIDvaSyd90iQJBcDBvDH7hXVTpiB9jiCSqmcRe79LWLGDPFjtQdXxC87mZ5oEVP78TtkZ5Tyx1JwLfcQKqbO-YChm32s2SOb8jxxsg4IIp_xS2pp7CCVNTxYdirRpvxJwC-PPq17BDEcVsZvpU6RG4Dv9-O718myf4Lda_dUdFsuVNuGc9zA4hCWy78xYGeT2UGmFwJE8NYFjQ97J");'></div>
<div class="flex flex-col flex-1 min-w-0">
<div class="flex justify-between items-start">
<p class="text-[#151d0c] dark:text-white text-base font-bold leading-tight line-clamp-1">Oversized Linen Shirt</p>
<span class="text-[#151d0c] dark:text-white font-bold ml-2">$59.00</span>
</div>
<p class="text-[#76a145] text-sm font-medium mt-1">Men's Apparel</p>
<div class="mt-3">
<div class="flex items-center gap-3 text-[#151d0c] dark:text-white">
<button class="flex h-8 w-8 items-center justify-center rounded-full bg-background-light dark:bg-white/10 hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-lg">remove</span>
</button>
<span class="text-base font-bold w-4 text-center">1</span>
<button class="flex h-8 w-8 items-center justify-center rounded-full bg-primary text-black hover:bg-primary/80 transition-colors">
<span class="material-symbols-outlined text-lg">add</span>
</button>
</div>
</div>
</div>
</div>
<!-- ListItem 2 -->
<div class="flex items-center gap-4 bg-white dark:bg-black/20 p-4 rounded-xl shadow-sm border border-black/5 dark:border-white/5">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-20 shrink-0" data-alt="Two organic cotton basic t-shirts folded neatly" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA4COyc97VYhkGiECKg-piAEuRtw6gGiV2CpeXC4pKWMPA6roySoXbo3zDi--o2POr8NzPBFhWR4fIU1PyW-IiUW0mDVahSmOHPULSKQ0CMWDHJMBBcyLCx_G5AqOWmnhLidSvqk0E0wV7WWmAuBfFjRBK8mE6mJDwtHfUli5QTxMILo9mkjKBjue2-94Y36cc6WysUyHkuLsZpJzZArQab88PyVTnKoKw-Db6YYBxkueu2WxAljN3RhBqcDsTgcC6mZbT8q3msLOlJ");'></div>
<div class="flex flex-col flex-1 min-w-0">
<div class="flex justify-between items-start">
<p class="text-[#151d0c] dark:text-white text-base font-bold leading-tight line-clamp-1">Organic Cotton Tee</p>
<span class="text-[#151d0c] dark:text-white font-bold ml-2">$59.00</span>
</div>
<p class="text-[#76a145] text-sm font-medium mt-1">Unisex Basic</p>
<div class="mt-3">
<div class="flex items-center gap-3 text-[#151d0c] dark:text-white">
<button class="flex h-8 w-8 items-center justify-center rounded-full bg-background-light dark:bg-white/10 hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-lg">remove</span>
</button>
<span class="text-base font-bold w-4 text-center">2</span>
<button class="flex h-8 w-8 items-center justify-center rounded-full bg-primary text-black hover:bg-primary/80 transition-colors">
<span class="material-symbols-outlined text-lg">add</span>
</button>
</div>
</div>
</div>
</div>
<!-- TextField (Discount Code) -->
<div class="pt-4">
<label class="flex flex-col w-full">
<p class="text-[#151d0c] dark:text-white text-base font-bold leading-normal pb-3 pl-1">Discount Code</p>
<div class="flex w-full items-stretch rounded-xl bg-white dark:bg-black/20 border border-black/5 dark:border-white/5 shadow-sm overflow-hidden">
<input class="form-input flex w-full min-w-0 flex-1 border-none bg-transparent focus:outline-0 focus:ring-0 h-14 placeholder:text-[#76a145]/60 px-4 text-base font-normal text-[#151d0c] dark:text-white" placeholder="Enter Discount Code" value="FASHION24"/>
<button class="bg-primary hover:bg-primary/90 text-black px-6 font-bold flex items-center transition-colors">
<span>Apply</span>
<span class="material-symbols-outlined ml-1 text-xl">check_circle</span>
</button>
</div>
</label>
</div>
<!-- DescriptionList (Financials) -->
<div class="p-6 mt-4 bg-white dark:bg-black/20 rounded-xl border border-black/5 dark:border-white/5">
<div class="flex justify-between gap-x-6 py-2">
<p class="text-[#76a145] text-sm font-medium leading-normal uppercase tracking-wider">Sub total</p>
<p class="text-[#151d0c] dark:text-white text-base font-medium leading-normal text-right">$118.00</p>
</div>
<div class="flex justify-between gap-x-6 py-2">
<p class="text-[#76a145] text-sm font-medium leading-normal uppercase tracking-wider">Discount (10%)</p>
<p class="text-red-500 text-base font-medium leading-normal text-right">-$11.80</p>
</div>
<div class="my-4 border-t border-dashed border-[#76a145]/20"></div>
<div class="flex justify-between items-center py-2">
<p class="text-[#151d0c] dark:text-white text-lg font-bold leading-normal">Total</p>
<p class="text-[#151d0c] dark:text-white text-2xl font-black leading-normal text-right">$106.20</p>
</div>
</div>
</div>
</main>
<!-- Fixed Checkout Button Footer -->
<div class="absolute bottom-0 left-0 right-0 p-4 pb-8 bg-gradient-to-t from-background-light via-background-light/90 to-transparent dark:from-background-dark dark:via-background-dark/90 z-20">
<button class="w-full bg-primary text-black h-16 rounded-xl text-lg font-bold tracking-tight shadow-xl shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Proceed to Checkout</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</body></html>
