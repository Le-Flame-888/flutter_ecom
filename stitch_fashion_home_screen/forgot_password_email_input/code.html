<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#71f425",
                        "background-light": "#ffffff",
                        "background-dark": "#1c1e22",
                        "charcoal": "#2E343D",
                        "muted": "#7A8491"
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Public Sans", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-shadow {
            box-shadow: 0 4px 20px -2px rgba(113, 244, 37, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex justify-center items-start antialiased text-charcoal dark:text-white">
<div class="relative w-full max-w-[430px] min-h-screen flex flex-col bg-background-light dark:bg-background-dark">
<!-- TopAppBar: iOS Style -->
<header class="flex items-center justify-between px-4 h-16 sticky top-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md z-10">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-start text-primary">
<span class="material-symbols-outlined text-[28px]">arrow_back_ios_new</span>
</button>
<h1 class="text-charcoal dark:text-white text-lg font-semibold leading-tight tracking-tight flex-1 text-center pr-10">
                Forgot Password
            </h1>
</header>
<main class="flex-1 flex flex-col items-center px-6 pt-10 pb-12">
<!-- Lock Icon Illustration Section -->
<div class="w-full flex justify-center mb-12">
<div class="relative flex items-center justify-center w-32 h-32 rounded-full bg-primary/10 dark:bg-primary/5">
<div class="absolute inset-0 border-2 border-dashed border-primary/20 rounded-full animate-[spin_10s_linear_infinite]"></div>
<div class="z-10 bg-primary text-charcoal w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg transform -rotate-3">
<span class="material-symbols-outlined text-[32px] font-bold">lock_reset</span>
</div>
<!-- Decorative Element -->
<div class="absolute -bottom-2 -right-2 bg-primary w-6 h-6 rounded-full border-4 border-white dark:border-background-dark"></div>
</div>
</div>
<!-- HeadlineText -->
<div class="w-full text-center space-y-3 mb-10">
<h2 class="text-charcoal dark:text-white text-3xl font-bold tracking-tight px-4 leading-[1.1]">
                    Recover Your <br/><span class="text-primary/90">Account</span>
</h2>
<!-- BodyText -->
<p class="text-muted dark:text-gray-400 text-base font-normal leading-relaxed px-6">
                    Enter your email address and we will send you a link to reset your password.
                </p>
</div>
<!-- TextField -->
<div class="w-full space-y-6">
<div class="flex flex-col gap-2">
<label class="flex flex-col w-full group">
<span class="text-charcoal dark:text-gray-300 text-sm font-semibold mb-2 ml-1 uppercase tracking-widest opacity-70">Email Address</span>
<div class="relative">
<input class="form-input flex w-full rounded-xl text-charcoal dark:text-white border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all h-16 pl-12 pr-4 text-base font-normal placeholder:text-muted/60" placeholder="name@example.com" type="email" value=""/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-muted/60">alternate_email</span>
</div>
</label>
</div>
<!-- Primary Action Button -->
<div class="pt-4">
<button class="w-full bg-primary hover:bg-primary/90 active:scale-[0.98] transition-all text-charcoal font-bold text-lg h-16 rounded-xl flex items-center justify-center gap-2 custom-shadow">
<span>Send Link</span>
<span class="material-symbols-outlined">send</span>
</button>
</div>
</div>
<!-- Footer Help Text (Optional) -->
<div class="mt-auto pt-8">
<p class="text-muted dark:text-gray-500 text-sm">
                    Remember your password? 
                    <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="#">Log in</a>
</p>
</div>
</main>
<!-- Decorative background elements -->
<div class="fixed top-[-10%] right-[-20%] w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed bottom-[-5%] left-[-10%] w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
</div>
</body></html>
