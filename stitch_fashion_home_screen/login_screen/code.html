<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b0ff57",
                        "background-light": "#ffffff",
                        "background-dark": "#1a230f",
                        "input-gray": "#f5f5f5",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#151d0c] antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- Large Accent Top Header -->
<div class="h-32 w-full bg-primary flex items-end p-6">
<!-- iOS Status Bar Placeholder Style -->
<div class="absolute top-4 left-6">
<span class="material-symbols-outlined text-[#151d0c]">arrow_back_ios</span>
</div>
</div>
<div class="flex flex-col px-6 pt-10 pb-12 flex-1">
<!-- Headline Section -->
<div class="mb-10">
<h1 class="text-[#151d0c] dark:text-white tracking-tight text-[40px] font-bold leading-tight">
                    Welcome Back
                </h1>
<p class="text-[#151d0c]/60 dark:text-white/60 mt-2 text-lg">Glad to see you again!</p>
</div>
<!-- Form Fields -->
<div class="space-y-6">
<!-- Email Field -->
<div class="flex flex-col w-full">
<p class="text-[#151d0c] dark:text-white text-sm font-semibold leading-normal pb-2 uppercase tracking-wider">Email Address</p>
<input class="form-input flex w-full rounded-xl text-[#151d0c] focus:outline-0 focus:ring-2 focus:ring-primary border-none bg-input-gray dark:bg-white/5 h-16 placeholder:text-gray-400 p-4 text-base font-normal shadow-sm transition-all" placeholder="name@example.com" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col w-full">
<p class="text-[#151d0c] dark:text-white text-sm font-semibold leading-normal pb-2 uppercase tracking-wider">Password</p>
<div class="relative flex w-full items-center">
<input class="form-input flex w-full rounded-xl text-[#151d0c] focus:outline-0 focus:ring-2 focus:ring-primary border-none bg-input-gray dark:bg-white/5 h-16 placeholder:text-gray-400 p-4 pr-12 text-base font-normal shadow-sm transition-all" placeholder="Enter your password" type="password"/>
<div class="absolute right-4 text-gray-400 cursor-pointer">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
<div class="flex justify-end mt-3">
<a class="text-[#151d0c] dark:text-primary text-sm font-medium underline decoration-primary underline-offset-4 decoration-2" href="#">Forgot Password?</a>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="mt-10">
<button class="w-full bg-primary py-5 rounded-xl text-[#151d0c] font-bold text-lg shadow-[0_4px_20px_rgba(176,255,87,0.3)] hover:scale-[0.98] transition-transform">
                    Login
                </button>
</div>
<!-- Divider -->
<div class="relative flex items-center py-10">
<div class="flex-grow border-t border-gray-200 dark:border-white/10"></div>
<span class="flex-shrink mx-4 text-gray-400 text-sm font-medium">Or continue with</span>
<div class="flex-grow border-t border-gray-200 dark:border-white/10"></div>
</div>
<!-- Social Logins -->
<div class="flex gap-4">
<button class="flex-1 flex items-center justify-center gap-2 border border-gray-200 dark:border-white/10 rounded-xl py-4 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-semibold text-sm">Google</span>
</button>
<button class="flex-1 flex items-center justify-center gap-2 border border-gray-200 dark:border-white/10 rounded-xl py-4 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.04 2.15-3.53 2.15-1.46 0-1.89-.88-3.56-.88-1.66 0-2.18.86-3.53.88-1.44.02-2.62-1.3-3.6-2.7C.8 16.89-.5 12.02 1.3 8.94c.9-1.53 2.45-2.48 4.14-2.5 1.28-.02 2.5.86 3.28.86.77 0 2.25-1.05 3.75-.9 1.5.02 2.84.54 3.7 1.8-3.15 1.9-2.64 6.2.5 7.46-.73 1.83-1.72 3.66-3.62 5.62zM12.98 4.4c.85-1.02 1.4-2.43 1.24-3.83-1.2.05-2.65.8-3.5 1.8-.77.88-1.44 2.34-1.27 3.7 1.34.1 2.68-.65 3.53-1.67z"></path>
</svg>
<span class="font-semibold text-sm">Apple</span>
</button>
</div>
<!-- Footer -->
<div class="mt-auto pt-10 text-center">
<p class="text-gray-600 dark:text-gray-400">
                    Don't have an account? 
                    <a class="text-[#151d0c] dark:text-primary font-bold ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
<!-- Decorative element -->
<div class="fixed -bottom-12 -right-12 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
</div>
</body></html>
