<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b5ff4d",
                        "background-light": "#ffffff",
                        "background-dark": "#1a1a1a",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Public Sans', sans-serif;
        }
        .message-bubble-agent {
            border-bottom-left-radius: 4px;
        }
        .message-bubble-user {
            border-bottom-right-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#1a1a1a] dark:text-white antialiased">
<div class="flex h-screen w-full max-w-[430px] mx-auto flex-col bg-background-light dark:bg-background-dark relative border-x border-gray-100 dark:border-zinc-800">
<!-- TopAppBar -->
<header class="sticky top-0 z-20 flex items-center justify-between bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-4 py-3 border-b border-gray-100 dark:border-zinc-800">
<div class="flex items-center gap-3">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-zinc-800 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="relative">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 border border-gray-200 dark:border-zinc-700" data-alt="portrait of a friendly female support agent" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAEANBlN8mbbCFKlyKbiK4x3Kp0HjUAskCVD-caxpVEyH4ZCxrzZYcuiTuYFtlT8KYOjbzfhjaibqbjAuy_IMr3VmaFIr_O1xdubaUDTEzL1g_ZkphG4_uM4nZKwnVy6cJdeGpBuUuGiEmP-YifE6DR2FVX-LKSmymZwBrbaqP5TQH4I8d7yVQ_jozTDYijbrxdUjwB-VWl3KKARKkaZ6xrCW0Vo0Zf3ISQ_5XUZ7RS_8RfbuE4i9Gs8UAzeKC0LVnoS3Mo3wJ-oyti");'>
</div>
<div class="absolute bottom-0 right-0 size-3 bg-primary border-2 border-white dark:border-background-dark rounded-full"></div>
</div>
<div class="flex flex-col">
<h2 class="text-[#1a1a1a] dark:text-white text-base font-bold leading-tight">Sarah</h2>
<span class="text-xs text-gray-500 dark:text-zinc-400 font-medium">Support Specialist</span>
</div>
</div>
<div class="flex items-center">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-zinc-800 transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<!-- Chat Container -->
<main class="flex-1 overflow-y-auto px-4 py-6 flex flex-col gap-6">
<!-- SectionHeader -->
<div class="flex items-center justify-center">
<span class="text-gray-400 dark:text-zinc-500 text-xs font-bold uppercase tracking-widest px-3 py-1 bg-gray-50 dark:bg-zinc-900 rounded-full">Today</span>
</div>
<!-- Agent Message -->
<div class="flex items-end gap-2 group">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-8 shrink-0 mb-5" data-alt="profile image of Sarah" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCihKRYqHkcA_YNPzor9CuBKrZbOvNEzalBZa7xzvjQod3Mjlm1x1d9XPlmxqGxa8l5fzpch-0tRWah2jkCVoAwJJYwBa4EUUw8PnANYDdQEbJdL8P96Cn_xZvz4Aq19I5CeJE47O7xlNfkGdhy3Y0qrr1A0cvFCo2YsiukVsRFxKWiKyM-oXmN6JXxY3FfX-KdCv15W1B_tcTCi5PZD5exwTKLW4Xf_Ee8n7hQMKe-fiec0fpJ4T12TcJ9Ja9U8tdeYxVbK_6wurfI");'>
</div>
<div class="flex flex-col gap-1 max-w-[80%]">
<div class="px-4 py-3 bg-[#f3f4f6] dark:bg-zinc-800 text-[#1a1a1a] dark:text-zinc-100 rounded-xl message-bubble-agent shadow-sm">
<p class="text-[15px] leading-relaxed">Hi there! I'm Sarah. How can I help you with your order today?</p>
</div>
<span class="text-[10px] text-gray-400 dark:text-zinc-500 ml-1">10:24 AM</span>
</div>
</div>
<!-- User Message -->
<div class="flex items-end justify-end gap-2 group">
<div class="flex flex-col items-end gap-1 max-w-[80%]">
<div class="px-4 py-3 bg-primary text-[#1a1a1a] rounded-xl message-bubble-user shadow-sm">
<p class="text-[15px] leading-relaxed font-medium">Hey! I wanted to check if the Neon Summer Jacket is back in stock in size M?</p>
</div>
<span class="text-[10px] text-gray-400 dark:text-zinc-500 mr-1">10:25 AM</span>
</div>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-8 shrink-0 mb-5" data-alt="avatar of the customer" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAoGNmOplurnTbe27Bdd1Y6EFUTyBxNVvUedH4xp_UmK45tdo6bpktYbHqMEoW2xbr-9naV4U5OVP7GcHkRpSoX12gM90tOyTEdWdSjfcawMbJQLFGXC5EqnKFFwMTn_fp0qj3zK8ves6Pd8fl-3VilUlkG8qfyZ_RZnsq9sjrnzpwciLTCce-5yLajRNvWd4vNfwOUhaltqbF8dAuVmgzuT7Mx6mOIKsaLZhOumNcb1VHwe0wWTAXaw4zxQiNnoJHJoI8FT0eNN1WT");'>
</div>
</div>
<!-- Agent Message -->
<div class="flex items-end gap-2">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-8 shrink-0 mb-5" data-alt="profile image of Sarah" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDeF644jIAIksgvj7BRV76BjA6rFQp5Ln5hUq4-RzBlfnP-qiVXaXxT_-UASIFJk13BakL0f1rVeybHqTGBb3USy_M6-QctEc9XimaaeUdw_8TSDIWlBphawuxX1YrSXkt6-PGtP3x3a1svcSz0GTXo_-oWk2p94CBW_ZFfyPi7EYz88O6KjEf8Ddrsm8RvUUVz_AU2cIuwq6_ymu2LG-nn9K4x6WZ-WI0nVj7PIARMTN1pHh6H4Y0UosZbS9rvI66FVyA5kNIfv8XF");'>
</div>
<div class="flex flex-col gap-1 max-w-[80%]">
<div class="px-4 py-3 bg-[#f3f4f6] dark:bg-zinc-800 text-[#1a1a1a] dark:text-zinc-100 rounded-xl message-bubble-agent shadow-sm">
<p class="text-[15px] leading-relaxed">Let me check that for you right now...</p>
</div>
<div class="flex items-center gap-1 mt-1 ml-1">
<div class="w-1 h-1 bg-primary rounded-full animate-pulse"></div>
<div class="w-1 h-1 bg-primary rounded-full animate-pulse delay-75"></div>
<div class="w-1 h-1 bg-primary rounded-full animate-pulse delay-150"></div>
<span class="text-[10px] text-gray-400 dark:text-zinc-500 ml-1">Sarah is typing</span>
</div>
</div>
</div>
</main>
<!-- Bottom Input Bar -->
<footer class="p-4 bg-background-light dark:bg-background-dark border-t border-gray-100 dark:border-zinc-800">
<div class="flex items-center gap-3">
<button class="flex items-center justify-center size-12 shrink-0 rounded-full bg-gray-50 dark:bg-zinc-900 text-gray-600 dark:text-zinc-400 hover:bg-gray-100 transition-colors">
<span class="material-symbols-outlined">add</span>
</button>
<div class="flex-1 relative flex items-center">
<input class="w-full bg-gray-50 dark:bg-zinc-900 border-none rounded-full py-3 px-5 text-[15px] focus:ring-2 focus:ring-primary/50 dark:text-white placeholder:text-gray-400 dark:placeholder:text-zinc-600" placeholder="Type a message..." type="text"/>
</div>
<button class="flex items-center justify-center size-12 shrink-0 rounded-full bg-primary text-[#1a1a1a] shadow-lg shadow-primary/20 active:scale-95 transition-transform">
<span class="material-symbols-outlined font-bold">send</span>
</button>
</div>
<!-- iOS Home Indicator Spacing -->
<div class="h-6"></div>
</footer>
</div>
</body></html>
